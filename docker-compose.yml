services:
  api:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION:-1.26.3}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
      # The image ships only the binary, so config (incl. SERVICES, which cannot
      # be set via env) is mounted here. DB_PATH/LOG_DIR below still win via env.
      - ./config:/app/config:ro
    environment:
      - GO_ENV=development
      - DB_PATH=/app/data/keeper.db
      - LOG_DIR=/app/log
    restart: always

  atlas:
    image: arigaio/atlas
    volumes:
      - .:/app
      - ./data:/data
    working_dir: /app

# No volumes section needed for bind mounts
