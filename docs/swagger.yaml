basePath: /
definitions:
  internal_app.About:
    properties:
      body:
        description: may contain HTML
        type: string
      heading:
        type: string
    type: object
  internal_app.AboutInput:
    properties:
      body:
        type: string
      heading:
        type: string
    type: object
  internal_app.Address:
    properties:
      city:
        type: string
      country:
        type: string
      line1:
        type: string
      line2:
        type: string
      postal_code:
        type: string
      state:
        type: string
    type: object
  internal_app.AddressInput:
    properties:
      city:
        type: string
      country:
        type: string
      line1:
        type: string
      line2:
        type: string
      postal_code:
        type: string
      state:
        type: string
    type: object
  internal_app.App:
    properties:
      about:
        $ref: '#/definitions/internal_app.About'
      contact:
        $ref: '#/definitions/internal_app.Contact'
      created_at:
        type: string
      id:
        type: integer
      logo_url:
        type: string
      name:
        type: string
      status:
        type: integer
      tagline:
        type: string
      tax_number:
        type: string
      tax_percent:
        type: number
      updated_at:
        type: string
    type: object
  internal_app.Contact:
    properties:
      address:
        $ref: '#/definitions/internal_app.Address'
      email:
        type: string
      hours:
        description: free text
        type: string
      phone1:
        type: string
      phone2:
        type: string
      social:
        additionalProperties:
          type: string
        type: object
    type: object
  internal_app.ContactInput:
    properties:
      address:
        $ref: '#/definitions/internal_app.AddressInput'
      email:
        type: string
      hours:
        type: string
      phone1:
        type: string
      phone2:
        type: string
      social:
        additionalProperties:
          type: string
        type: object
    type: object
  internal_app.CreateAppRequest:
    properties:
      about:
        $ref: '#/definitions/internal_app.AboutInput'
      contact:
        $ref: '#/definitions/internal_app.ContactInput'
      logo_url:
        type: string
      name:
        type: string
      status:
        type: integer
      tagline:
        type: string
      tax_number:
        type: string
      tax_percent:
        maximum: 100
        minimum: 0
        type: number
    required:
    - name
    type: object
  internal_app.PublicApp:
    properties:
      about:
        $ref: '#/definitions/internal_app.About'
      contact:
        $ref: '#/definitions/internal_app.Contact'
      id:
        type: integer
      logo_url:
        type: string
      name:
        type: string
      tagline:
        type: string
      tax_number:
        type: string
      tax_percent:
        type: number
    type: object
  internal_app.UpdateAppRequest:
    properties:
      about:
        $ref: '#/definitions/internal_app.AboutInput'
      contact:
        $ref: '#/definitions/internal_app.ContactInput'
      logo_url:
        type: string
      name:
        type: string
      status:
        type: integer
      tagline:
        type: string
      tax_number:
        type: string
      tax_percent:
        maximum: 100
        minimum: 0
        type: number
    type: object
  internal_division.CreateDivisionRequest:
    properties:
      app_id:
        type: integer
      name:
        maxLength: 100
        type: string
      parent_id:
        type: integer
    required:
    - app_id
    - name
    type: object
  internal_division.Division:
    properties:
      app_id:
        type: integer
      created_at:
        type: string
      depth:
        type: integer
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  internal_division.MoveDivisionRequest:
    properties:
      parent_id:
        type: integer
    type: object
  internal_division.UpdateDivisionRequest:
    properties:
      name:
        maxLength: 100
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
    type: object
  internal_guestkey.CreateGuestKeyRequest:
    properties:
      app_id:
        type: integer
      division_id:
        type: integer
      domain:
        description: |-
          Domain is the URL the publishable UI is served from. It is normalized
          server-side (scheme/port stripped, host lowercased, host[+path]) and
          must be unique — a public URL lookup resolves to exactly one site key.
        type: string
      name:
        type: string
      status:
        type: integer
      user_id:
        type: integer
    required:
    - app_id
    - division_id
    - domain
    - name
    - user_id
    type: object
  internal_guestkey.GuestAuthRequest:
    properties:
      site_key:
        type: string
    required:
    - site_key
    type: object
  internal_guestkey.GuestAuthResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  internal_guestkey.GuestKey:
    properties:
      app_id:
        type: integer
      created_at:
        type: string
      division_id:
        type: integer
      domain:
        type: string
      id:
        type: integer
      name:
        type: string
      site_key:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  internal_guestkey.SiteKeyLookupResponse:
    properties:
      site_key:
        type: string
    type: object
  internal_guestkey.UpdateGuestKeyRequest:
    properties:
      name:
        type: string
      status:
        type: integer
    type: object
  internal_impersonation.ExchangeRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  internal_impersonation.ExchangeResponse:
    properties:
      audience:
        type: string
      expires_at:
        type: string
      session_id:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/internal_impersonation.TargetUser'
    type: object
  internal_impersonation.ImpersonationSession:
    properties:
      app_id:
        type: integer
      audience:
        type: string
      created_at:
        type: string
      division_id:
        type: integer
      expires_at:
        type: string
      id:
        type: integer
      impersonator_user_id:
        type: integer
      read_only:
        type: boolean
      reason:
        type: string
      revoked_at:
        type: string
      session_id:
        type: string
      status:
        type: integer
      target_user_id:
        type: integer
    type: object
  internal_impersonation.LogoutRequest:
    properties:
      session_id:
        type: string
    required:
    - session_id
    type: object
  internal_impersonation.ServiceInfo:
    properties:
      audience:
        type: string
      key:
        type: string
      ui_exchange_url:
        type: string
    type: object
  internal_impersonation.SessionStatusResponse:
    properties:
      active:
        type: boolean
    type: object
  internal_impersonation.StartImpersonationRequest:
    properties:
      audience:
        type: string
      read_only:
        type: boolean
      reason:
        type: string
      target_user_id:
        type: integer
    required:
    - audience
    - target_user_id
    type: object
  internal_impersonation.StartImpersonationResponse:
    properties:
      audience:
        type: string
      code:
        type: string
      expires_at:
        type: string
      session_id:
        type: string
    type: object
  internal_impersonation.TargetUser:
    properties:
      app_id:
        type: integer
      division_id:
        type: integer
      email:
        type: string
      firstname:
        type: string
      id:
        type: integer
      lastname:
        type: string
      role:
        type: integer
      status:
        type: integer
    type: object
  internal_user.AuthRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_user.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_user.User'
    type: object
  internal_user.CreateUserRequest:
    properties:
      app_id:
        type: integer
      division_id:
        type: integer
      email:
        type: string
      firstname:
        type: string
      lastname:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: integer
    required:
    - app_id
    - division_id
    - email
    - firstname
    - lastname
    - password
    type: object
  internal_user.UpdateUserRequest:
    properties:
      app_id:
        type: integer
      division_id:
        type: integer
      email:
        type: string
      firstname:
        type: string
      lastname:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: integer
      status:
        type: integer
    type: object
  internal_user.User:
    properties:
      app_id:
        type: integer
      app_name:
        type: string
      created_at:
        type: string
      division_id:
        type: integer
      division_name:
        type: string
      email:
        type: string
      firstname:
        type: string
      id:
        type: integer
      lastname:
        type: string
      role:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
    type: object
  keeper_pkg_render.Response:
    properties:
      data: {}
      error:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a microservice for user management.
  title: Keeper API
  version: "1.0"
paths:
  /apps:
    get:
      description: Get a list of all registered apps
      parameters:
      - description: Max results (default 50, max 500)
        in: query
        name: limit
        type: integer
      - description: Result offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_app.App'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: List all apps
      tags:
      - apps
    post:
      consumes:
      - application/json
      description: Create a new app with the provided details
      parameters:
      - description: App details
        in: body
        name: app
        required: true
        schema:
          $ref: '#/definitions/internal_app.CreateAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_app.App'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Create a new app
      tags:
      - apps
  /apps/{id}:
    delete:
      description: Remove an app from the system by ID
      parameters:
      - description: App ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Delete app
      tags:
      - apps
    get:
      description: Get a single app by its unique ID
      parameters:
      - description: App ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_app.App'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Get app by ID
      tags:
      - apps
    put:
      consumes:
      - application/json
      description: Update an existing app's details
      parameters:
      - description: App ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated app details
        in: body
        name: app
        required: true
        schema:
          $ref: '#/definitions/internal_app.UpdateAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_app.App'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Update app
      tags:
      - apps
  /apps/{id}/public:
    get:
      description: Public-safe profile (name, tagline, logo, about, contact) for an
        active app. Public (no auth) and hard rate-limited; used by downstream services
        to enrich their responses. Returns 404 for an unknown or inactive app.
      parameters:
      - description: App ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_app.PublicApp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Get public app profile by ID
      tags:
      - apps
  /apps/lookup:
    get:
      description: Resolve the public-safe profile (name, tagline, logo, about, contact)
        for the app bound to a publishable guest site key. Public (no auth) and hard
        rate-limited. Returns 404 for an unknown/inactive site key or an inactive
        app, without distinguishing between them.
      parameters:
      - description: Publishable guest site key (gk_...)
        in: query
        name: site_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_app.PublicApp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Look up public app profile by site key
      tags:
      - apps
  /divisions:
    get:
      description: List divisions for the caller's app. Filter by parent_id via query
        param.
      parameters:
      - description: Filter by parent ID
        in: query
        name: parent_id
        type: integer
      - description: Max results (default 50, max 500)
        in: query
        name: limit
        type: integer
      - description: Result offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_division.Division'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: List divisions
      tags:
      - divisions
    post:
      consumes:
      - application/json
      description: Create a new division with optional parent for hierarchical grouping
      parameters:
      - description: Division details
        in: body
        name: division
        required: true
        schema:
          $ref: '#/definitions/internal_division.CreateDivisionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_division.Division'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Create a new division
      tags:
      - divisions
  /divisions/{id}:
    delete:
      description: Delete a division. Blocked if it has children or assigned users.
      parameters:
      - description: Division ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Delete a division
      tags:
      - divisions
    get:
      description: Get a single division by its ID (must belong to caller's app)
      parameters:
      - description: Division ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_division.Division'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Get division by ID
      tags:
      - divisions
    put:
      consumes:
      - application/json
      description: Update name or status of an existing division
      parameters:
      - description: Division ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated division details
        in: body
        name: division
        required: true
        schema:
          $ref: '#/definitions/internal_division.UpdateDivisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_division.Division'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Update a division
      tags:
      - divisions
  /divisions/{id}/descendants:
    get:
      description: Returns all divisions in the subtree rooted at the given division
      parameters:
      - description: Division ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_division.Division'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Get all descendants of a division
      tags:
      - divisions
  /divisions/{id}/move:
    put:
      consumes:
      - application/json
      description: Move a division (and its subtree) to a different parent. Set parent_id
        to null to promote to root.
      parameters:
      - description: Division ID
        in: path
        name: id
        required: true
        type: integer
      - description: New parent
        in: body
        name: move
        required: true
        schema:
          $ref: '#/definitions/internal_division.MoveDivisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_division.Division'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Move a division to a new parent
      tags:
      - divisions
  /guest-keys:
    get:
      description: List guest keys. Non-sysadmins only see keys for their own app.
      parameters:
      - description: Max results (default 50, max 500)
        in: query
        name: limit
        type: integer
      - description: Result offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_guestkey.GuestKey'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: List guest keys
      tags:
      - guest-keys
    post:
      consumes:
      - application/json
      description: Create a publishable site key bound to an app/division and a designated
        guest user. Non-sysadmins can only create keys for their own app.
      parameters:
      - description: Guest key details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_guestkey.CreateGuestKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_guestkey.GuestKey'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Create a new guest key
      tags:
      - guest-keys
  /guest-keys/{id}:
    delete:
      description: Delete (revoke) a guest key. Non-sysadmins can only delete keys
        of their own app.
      parameters:
      - description: Guest key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Delete guest key
      tags:
      - guest-keys
    get:
      description: Get a single guest key by its unique ID. Non-sysadmins can only
        access keys of their own app.
      parameters:
      - description: Guest key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_guestkey.GuestKey'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Get guest key by ID
      tags:
      - guest-keys
    put:
      consumes:
      - application/json
      description: Update a guest key's name or status. Tenant binding and the site
        key are immutable. Non-sysadmins can only update keys of their own app.
      parameters:
      - description: Guest key ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_guestkey.UpdateGuestKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_guestkey.GuestKey'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Update guest key
      tags:
      - guest-keys
  /guest-keys/auth:
    post:
      consumes:
      - application/json
      description: Exchange a publishable site key for a short-lived tenant-scoped
        guest JWT (role=guest, signed with the guest secret)
      parameters:
      - description: Site key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_guestkey.GuestAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_guestkey.GuestAuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Exchange a site key for a guest token
      tags:
      - guest-keys
  /guest-keys/lookup:
    get:
      description: Resolve the publishable site key registered for the URL a UI is
        served from. Public (no auth) and hard rate-limited; returns only the site
        key, not tenant binding. The url is normalized (scheme/port stripped, host
        lowercased, host[+path]) and matched exactly.
      parameters:
      - description: URL the UI is served from (e.g. https://shop.acme.com or acme.com/store)
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_guestkey.SiteKeyLookupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Look up a publishable site key by URL
      tags:
      - guest-keys
  /health:
    get:
      description: Get the health status of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Check service health
      tags:
      - health
  /impersonations:
    get:
      description: Sysadmin-only. Lists active impersonation sessions for audit.
      parameters:
      - description: Max results (default 50, max 500)
        in: query
        name: limit
        type: integer
      - description: Result offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_impersonation.ImpersonationSession'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: List active impersonation sessions
      tags:
      - impersonation
    post:
      consumes:
      - application/json
      description: Sysadmin-only. Mints a one-time handoff code for logging in as
        another user on a registered downstream service. The code is exchanged (cross-origin)
        for the actual token. Refuses to target a sysadmin.
      parameters:
      - description: Target user and audience
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_impersonation.StartImpersonationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_impersonation.StartImpersonationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Start an impersonation session
      tags:
      - impersonation
  /impersonations/{id}:
    get:
      description: Sysadmin-only.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_impersonation.ImpersonationSession'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Get an impersonation session by ID
      tags:
      - impersonation
  /impersonations/{id}/revoke:
    post:
      description: Sysadmin-only. Revokes a session server-side; downstream services
        reject its token on next request.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_impersonation.ImpersonationSession'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Revoke an impersonation session by ID
      tags:
      - impersonation
  /impersonations/active/{session_id}:
    get:
      description: Public (no auth) and rate-limited. Returns a boolean only — no
        identity or tenant data — so downstream services can cheaply enforce revocation.
      parameters:
      - description: Opaque session id
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_impersonation.SessionStatusResponse'
              type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Check whether an impersonation session is active
      tags:
      - impersonation
  /impersonations/exchange:
    post:
      consumes:
      - application/json
      description: Public (no auth) and rate-limited. Redeems a one-time code for
        a short-lived, audience-scoped impersonation token plus the impersonated user
        object. Called cross-origin by the target service UI's exchange page.
      parameters:
      - description: Handoff code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_impersonation.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_impersonation.ExchangeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Exchange a handoff code for an impersonation token
      tags:
      - impersonation
  /impersonations/logout:
    post:
      consumes:
      - application/json
      description: Public (no auth) and rate-limited. Revokes a session by its opaque
        id — used by the impersonation tab on exit. Knowing the unguessable session
        id is the capability; revocation only reduces access.
      parameters:
      - description: Session id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_impersonation.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Revoke an impersonation session (self-service)
      tags:
      - impersonation
  /impersonations/services:
    get:
      description: Sysadmin-only. Returns the services a sysadmin can impersonate
        a user into, for the UI service picker.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_impersonation.ServiceInfo'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: List registered impersonation target services
      tags:
      - impersonation
  /users:
    get:
      description: Get a list of all users belonging to the caller's app
      parameters:
      - description: Max results (default 50, max 500)
        in: query
        name: limit
        type: integer
      - description: Result offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_user.User'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: List all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user with the provided details
      parameters:
      - description: User details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_user.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Create a new user
      tags:
      - users
  /users/{id}:
    delete:
      description: Remove a user from the system by ID (must belong to caller's app)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Delete user
      tags:
      - users
    get:
      description: Get a single user by their unique ID (must belong to caller's app)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_user.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update an existing user's details (must belong to caller's app)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated user details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_user.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      security:
      - Bearer: []
      summary: Update user
      tags:
      - users
  /users/auth:
    post:
      consumes:
      - application/json
      description: Login with email and password to receive a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_user.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/keeper_pkg_render.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_user.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keeper_pkg_render.Response'
      summary: Authenticate user
      tags:
      - users
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
